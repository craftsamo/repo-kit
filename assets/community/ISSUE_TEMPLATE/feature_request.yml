name: Feature request
description: Propose a new feature or a change.
{{labels}}
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to open the pull request for this.

name: Bug report
description: A command or workflow does not work as the README says.
labels: [fix]
body:
  - type: markdown
    attributes:
      value: |
        Search the existing issues first, and check that the bug is still there in the latest release. Report a vulnerability privately, as SECURITY.md describes, not here.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - setup github
        - setup secrets
        - agents sync
        - check commit-size
        - labels sync
        - release draft, publish or sync
        - opencode.yml (/oc agents)
        - labels-sync.yml
        - release-draft.yml
        - release-publish.yml
        - Something else
    validations:
      required: true
  - type: textarea
    id: run
    attributes:
      label: What you ran
      description: The command and its options, or the job that calls the workflow.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or the failing step's log. Remove any secret values first.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`repo-kit --version` or the tag the workflow is pinned to, `node --version` and `gh --version`."
      placeholder: repo-kit 1.0.1 (or @v1), Node.js 24.x, gh 2.x
    validations:
      required: true
